$ws=Workspaces
$d=[$ws|Navigation]
bindd = $mainMod, 1, $d navigate to workspace 1 , split:workspace, 1
bindd = $mainMod, 2, $d navigate to workspace 2 , split:workspace, 2
bindd = $mainMod, 3, $d navigate to workspace 3 , split:workspace, 3
bindd = $mainMod, 4, $d navigate to workspace 4 , split:workspace, 4
bindd = $mainMod, 5, $d navigate to workspace 5 , split:workspace, 5
bindd = $mainMod, 6, $d navigate to workspace 6 , split:workspace, 6
bindd = $mainMod, 7, $d navigate to workspace 7 , split:workspace, 7
bindd = $mainMod, 8, $d navigate to workspace 8 , split:workspace, 8
bindd = $mainMod, 9, $d navigate to workspace 9 , split:workspace, 9
bindd = $mainMod, 0, $d navigate to workspace 10 ,split:workspace, 10

# -- IMPROCED: Previous Workspace --
bindd = $mainMod, Backspace, $d jump to previous workspace, workspace, previous

$d=[$ws|Navigation|Relative workspace]
bindd = $mainMod Control, Right, $d change active workspace forwards  , workspace, r+1
bindd = $mainMod Control, Left, $d change active workspace backwards , workspace, r-1

$d=[$ws|Navigation]
bindd = $mainMod Control, Down, $d navigate to the nearest empty workspace , workspace, empty
# -- IMPROCED: Move to Empty --
bindd = $mainMod Shift Control, Down, $d move active window to empty workspace, movetoworkspace, empty

# SWAPPED: Move focused window to a workspace silently (Now on SHIFT)
$d=[$ws|Navigation|Move window silently]
bindd = $mainMod Shift, 1, $d move to workspace 1 (silent), movetoworkspacesilent, 1
bindd = $mainMod Shift, 2, $d move to workspace 2 (silent), movetoworkspacesilent, 2
bindd = $mainMod Shift, 3, $d move to workspace 3 (silent), movetoworkspacesilent, 3
bindd = $mainMod Shift, 4, $d move to workspace 4 (silent), movetoworkspacesilent, 4
bindd = $mainMod Shift, 5, $d move to workspace 5 (silent), movetoworkspacesilent, 5
bindd = $mainMod Shift, 6, $d move to workspace 6 (silent), movetoworkspacesilent, 6
bindd = $mainMod Shift, 7, $d move to workspace 7 (silent), movetoworkspacesilent, 7
bindd = $mainMod Shift, 8, $d move to workspace 8 (silent), movetoworkspacesilent, 8
bindd = $mainMod Shift, 9, $d move to workspace 9 (silent), movetoworkspacesilent, 9
bindd = $mainMod Shift, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

# Move focused window to a relative workspace
$d=[$ws]
bindd = $mainMod Control+Alt, Right, $d move window to next relative workspace , movetoworkspace, r+1
bindd = $mainMod Control+Alt, Left, $d move window to previous relative workspace , movetoworkspace, r-1


# Scroll through existing workspaces
$d=[$ws|Navigation]
bindd = $mainMod, mouse_down, $d next workspace, workspace, e+1
bindd = $mainMod, mouse_up, $d previous workspace, workspace, e-1


# Move/Switch to special workspace (scratchpad)
$d=[$ws|Navigation|Special workspace]

bind = Alt Shift, M, exec, ~/.config/hypr/scripts/scratchpad_manager.sh
bind = Alt Shift, S, exec, ~/.config/hypr/scripts/scratchpad_manager1.sh
#bindd = Alt Control, S, $d move to scratchpad  , movetoworkspace, special
#bindd = Alt Shift, S, $d move to scratchpad (silent) , movetoworkspacesilent, special
#bindd = Alt, S, $d toggle scratchpad ,  togglespecialworkspace
bind = Alt , M, togglespecialworkspace, minimized
bind = Alt ,S, togglespecialworkspace, obsidian

# SWAPPED: Move focused window to a workspace (Now on ALT)
$d=[$ws|Move window to workspace]
bindd = $mainMod Alt, 1, $d move to workspace 1, split:movetoworkspace, 1
bindd = $mainMod Alt, 2, $d move to workspace 2, split:movetoworkspace, 2
bindd = $mainMod Alt, 3, $d move to workspace 3, split:movetoworkspace, 3
bindd = $mainMod Alt, 4, $d move to workspace 4, split:movetoworkspace, 4
bindd = $mainMod Alt, 5, $d move to workspace 5, split:movetoworkspace, 5
bindd = $mainMod Alt, 6, $d move to workspace 6, split:movetoworkspace, 6
bindd = $mainMod Alt, 7, $d move to workspace 7, split:movetoworkspace, 7
bindd = $mainMod Alt, 8, $d move to workspace 8, split:movetoworkspace, 8
bindd = $mainMod Alt, 9, $d move to workspace 9, split:movetoworkspace, 9
bindd = $mainMod Alt, 0, $d move to workspace 10, split:movetoworkspace, 10

$d=[$ws|Mark navigation]

# -----------------------------------------------------
# Submap: Add Marks (Shift + M)
# -----------------------------------------------------
bind = $mainMod SHIFT, M, submap, marksadd
submap = marksadd

# Exit with Escape
bind = , escape, submap, reset

# Bindings for a-z (Add Mark and auto-exit submap)
bind = , a, scroller:marksadd, a
bind = , a, submap, reset
bind = , b, scroller:marksadd, b
bind = , b, submap, reset
bind = , c, scroller:marksadd, c
bind = , c, submap, reset
