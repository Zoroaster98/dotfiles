# -----------------------------------------------------
# Submap: Visit Marks (M)
# -----------------------------------------------------
bind = $mainMod, M, submap, marksvisit
submap = marksvisit

# Exit with Escape
bind = , escape, submap, reset

# Bindings for a-z (Visit Mark and auto-exit submap)
bind = , a, scroller:marksvisit, a
bind = , a, submap, reset
bind = , b, scroller:marksvisit, b
