# Optional: Ensure it's in your cycle list (this is the default list)
plugin {
    scroller {
        column_widths = onethird onehalf twothirds one
    }
}
#bind = $mainMod, tab, scroller:toggleoverview
# Switch to Row mode (Horizontal scrolling)

bind = $mainMod, r, exec, ~/.config/hypr/scripts/hyprscroller_mode.sh
# Switch to Column mode (Vertical stacking)
bind = $mainMod shift, P, scroller:pin

exec-once = hyprpm reload -n
exec-once = [workspace 3] qutebrowser
exec-once = [workspace 3] kitty
exec-once = [workspace 2] yazi
exec-once = [worlspace 1] obsidian
exec-once = [worlspace 1] kitty 
#exec-once = [worlspace 4 silent] windscribe
exec-once = xremap .config/xremap/config.yml
# --- Autostart Scripts ---
# Execute the script to mount the Windows partition at startup
exec-once = ~/.config/hypr/scripts/mount_windows.sh
exec-once = hyprsunset
exec-once = fcitx5 -d
exec-once = ollama serve
