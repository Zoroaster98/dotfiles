# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


input {
 # See https://wiki.hyprland.org/Configuring/Variables/#input
     kb_layout = us
     kb_options = caps:escape
     follow_mouse = 1
sensitivity = 1
  force_no_accel = false
#accel_profile = custom 200 0.0 0.5 2.0 5.0 10.0
     numlock_by_default = false
     # ~/.config/hypr/hyprland.conf

    # ... other settings like kb_layout ...
    # Sets how often the key repeats per second (default is usually 25)
    repeat_rate = 40

    # Sets the delay in ms before the repeat starts (default is usually 600)
    repeat_delay = 200

     touchpad {
 # See https://wiki.hyprland.org/Configuring/Variables/#touchpad
         natural_scroll = yes
     }
 }

decoration {
 fullscreen_opacity = 0.8
}

device {
  name = syna2ba6:00-06cb:ce44-touchpad
  sensitivity = 0.5
  scroll_factor = 2.5
}

general {
  layout = scroller
}

