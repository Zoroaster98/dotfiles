$wm=Window Management
$d=[$wm]
bindd = $mainMod, Q, $d close focused window, exec, hyde-shell dontkillsteam

bindd = Alt, F4, $d close focused window, exec, $scrPath/dontkillsteam.sh
bindd = $mainMod, Delete, $d kill hyprland session, exit
bindd = $mainMod, W, $d Toggle floating,  exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 95% 95%; dispatch centerwindow"
bindd = $mainMod, G, $d toggle group, togglegroup
bindd = , F11, $d toggle fullscreen, fullscreen
bindd = $mainMod, F, $d toggle fullscreen, fullscreen
bindd = $mainMod, D, $d lock screen, exec, lockscreen.sh
bindd = $mainMod Shift, F, $d toggle pin on focused window, exec, $scrPath/windowpin.sh
bindd = Control Alt, Delete, $d logout menu, exec, $scrPath/logoutlaunch.sh
bindd = Alt_R, Control_R, $d toggle waybar and reload config, exec, killall waybar || (env reload_flag=1 $scrPath/wbarconfgen.sh)
# bindd = ALT_R, Control_R,toggle waybar, exec, killall waybar || waybar # toggle waybar without reloading, this is faster

#$d=[$wm|Group Navigation]
#bindd = $mainMod Shift, H, $d change active group backwards   , changegroupactive, b
#bindd = $mainMod Shift, L, $d change active group forwards  , changegroupactive, f

# -- HYPRSCROLLER: Admit/Expel Window (Formerly on ALT, now on SHIFT) --
bind = $mainMod SHIFT, h, scroller:admitwindow, l
bind = $mainMod SHIFT, l, scroller:admitwindow, r
bind = $mainMod SHIFT, j, scroller:expelwindow, l
bind = $mainMod SHIFT, k, scroller:expelwindow, r

$d=[$wm|Change focus]
# Updated Arrow keys to use scroller:movefocus
bindd = $mainMod, Left, $d focus left, scroller:movefocus, l
bindd = $mainMod, Right, $d focus right , scroller:movefocus, r
bindd = $mainMod, Up, $d focus up , scroller:movefocus, u
bindd = $mainMod, Down , $d focus down, scroller:movefocus, d

bindd = ALT, Tab,$d Cycle focus, cyclenext

bindd = ALT, Tab,$d Cycle focus, cyclenext

bind = $mainMod, h, scroller:movefocus, l
bind = $mainMod, l, scroller:movefocus, r
bind = $mainMod, k, scroller:movefocus, u
bind = $mainMod, j, scroller:movefocus, d
bind = $mainMod, home, scroller:movefocus, begin
bind = $mainMod, end, scroller:movefocus, end

# -- IMPROVISED: Master Layout --
# These specific binds only work when using the "master" layout
$d=[$wm|Master Layout]
bindd = $mainMod, Return, $d swap with master, layoutmsg, swapwithmaster
bindd = $mainMod Shift, Return, $d focus master, layoutmsg, focusmaster
bindd = $mainMod Shift, M, $d add master window, layoutmsg, addmaster
bindd = $mainMod Control, M, $d remove master window, layoutmsg, removemaster
bindd = $mainMod Alt, comma, $d cycle orientation next, layoutmsg, orientationnext
bindd = $mainMod Alt, period, $d cycle orientation prev, layoutmsg, orientationprev

$d=[$wm|Resize Active Window]
# Resize windows
# Now mapped to Shift Control as requested (previously Shift and Control separately)
bindde = $mainMod Shift Control, Right, $d resize window right , resizeactive, 30 0
bindde = $mainMod Shift Control, Left, $d resize window left, resizeactive, -30 0
bindde = $mainMod Shift Control, Up, $d resize window up, resizeactive, 0 -30
bindde = $mainMod Shift Control, Down, $d resize  window down, resizeactive, 0 30

bindde = $mainMod Shift Control, L, $d resize window right , resizeactive, 30 0
bindde = $mainMod Shift Control, H, $d resize window left, resizeactive, -30 0
bindde = $mainMod Shift Control, K, $d resize window up, resizeactive, 0 -30
bindde = $mainMod Shift Control, J, $d resize  window down, resizeactive, 0 30

# Cycle focus through all monitors
bind = $mainMod Shift, A, focusmonitor, +1
# -- Hyprscroller Layout Submap --
# Mode: W=Fit Width, H=Fit Height, S=Fit Size, Esc=Exit
bind = $mainMod, A, submap, fit_window
submap = fit_window
bind = , w, scroller:fitwidth, all
bind = , w, submap, reset
bind = , H, scroller:fitheight, all
bind = , H, submap, reset
bind = , h, scroller:fitsize, tobeg
bind = , h, submap, reset
bind = , l, scroller:fitsize, toend
bind = , l, submap, reset
bind = , s, scroller:fitsize, all
bind = , s, submap, reset
bind = , escape, submap, reset
submap = reset# Move active window around current workspace
# Now mapped to ALT as requested (previously Shift Control)
$d=[$wm|Move active window across workspace]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = $mainMod Alt, left, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Alt, right, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Alt, up, Move active window up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Alt, down, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

bindde = $mainMod Alt, h, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Alt, l, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Alt, k, Move active window up, exec, $moveactivewindow 0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Alt, j, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move/Resize focused window
$d=[$wm|Move & Resize with mouse]
binddm = $mainMod, mouse:272, $d hold to move window, movewindow
binddm = $mainMod, mouse:273, $d hold to resize window, resizewindow
binddm = $mainMod, Z, $d hold to move window , movewindow
binddm = $mainMod, X, $d hold to resize window, resizewindow

# Toggle focused window split
$d=[$wm]
bindd = $mainMod Shift control, S, $d toggle split, togglesplit


bind = $mainMod, r, exec, ~/.config/hypr/scripts/hyprscroller_mode.sh
bind = $mainMod, tab, scroller:toggleoverview
bind = $mainMod shift, P, scroller:pin

# Center submap
# will switch to a submap called center
bind = $mainMod, C, submap, center
# will start a submap called "center
submap = center
# sets repeatable binds for resizing the active window
bind = , C, scroller:alignwindow, c
bind = , C, submap, reset
bind = , m, scroller:alignwindow, m
bind = , m, submap, reset
bind = , l, scroller:alignwindow, r
bind = , l, submap, reset
bind = , h, scroller:alignwindow, l
bind = , h, submap, reset
bind = , j , scroller:alignwindow, u
bind = , j, submap, reset
bind = , k, scroller:alignwindow, d
bind = , k, submap, reset
# use reset to go back to the global submap
bind = , escape, submap, reset
# will reset the submap, meaning end the current one and return to the global one
submap = reset


